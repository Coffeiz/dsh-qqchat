# dsh-qqchat is a profile bundle: installing it through `dsh plugin` appends
# this patch after the selected profile's shipped bundles.
- insert:
    - id: dsh-qqchat
      name: dsh-qqchat
      config:
        dataDir: !!js dshHomePath('plugins/dsh-qqchat')

# DSH 0.1.6's Connection RPC registry owns route lifetimes on the
# connection fiber, so that fiber must also receive the Web server service.
- id: connection
  inject: [webRuntime, webServer]
